# Read platform images for scanning. Job execution is granted separately
# in swkoo-workers; the backend cannot create Jobs beside platform secrets.
#
# Apply once with:
#   kubectl apply -f deploy/argocd/swkoo-backend-scan-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swkoo-backend-scan-jobs
  namespace: swkoo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["swkoo-backend", "swkoo-frontend"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swkoo-backend-scan-jobs
  namespace: swkoo
subjects:
  - kind: ServiceAccount
    name: swkoo-backend
    namespace: swkoo
roleRef:
  kind: Role
  name: swkoo-backend-scan-jobs
  apiGroup: rbac.authorization.k8s.io
