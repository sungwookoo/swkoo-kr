apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swkoo-local-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sungwookoo/swkoo-kr.git
    targetRevision: main
    path: deploy/local-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
