apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: swkoo-private-users
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  templatePatch: |
    {{- if eq (toString (dig "suspended" false .)) "true" }}
    spec:
      source:
        kustomize:
          replicas:
            - name: {{ .appName | toJson }}
              count: 0
    {{- end }}
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/kustomize/images
  generators:
    - git:
        repoURL: https://github.com/swkoo-deploy/private-registrations.git
        revision: main
        files:
          - path: deploy/users/*.yaml
  template:
    metadata:
      name: 'swkoo-user-{{ .login }}'
      annotations:
        argocd-image-updater.argoproj.io/image-list: 'app={{ .image.repo }}:latest'
        argocd-image-updater.argoproj.io/app.update-strategy: digest
        argocd-image-updater.argoproj.io/app.pull-secret: 'pullsecret:user-{{ .login }}/swkoo-private-package'
        argocd-image-updater.argoproj.io/write-back-method: argocd
        swkoo.kr/source-repo: '{{ .sourceRepo }}'
        swkoo.kr/private-image: 'true'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/{{ .deployRepo }}.git'
        targetRevision: main
        path: .
        # Keep the parent object when removing the replicas override.
        kustomize: {}
      destination:
        server: https://kubernetes.default.svc
        namespace: 'user-{{ .login }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
