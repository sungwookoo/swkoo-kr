apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swkoo-workers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sungwookoo/swkoo-kr.git
    targetRevision: main
    path: deploy/workers
  destination:
    server: https://kubernetes.default.svc
    namespace: swkoo-workers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
