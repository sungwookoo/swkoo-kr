apiVersion: v1
kind: Pod
metadata:
  name: helper-pod
spec:
  containers:
    - name: helper-pod
      image: nrt.ocir.io/nrznn4yiltsz/swkoo/backend:storage-helper-6617a2e69ca5ce0c9b4fbadff427572135c0b98c
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
          add:
            - DAC_OVERRIDE
            - FOWNER
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
  automountServiceAccountToken: false
  imagePullSecrets:
    - name: ocir-credentials
  securityContext:
    seccompProfile:
      type: RuntimeDefault
