apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - deployment.yaml
configMapGenerator:
  - name: local-path-config
    files:
      - config.json
      - helperPod.yaml
      - setup=setup.sh
      - teardown=teardown.sh
generatorOptions:
  disableNameSuffixHash: true
