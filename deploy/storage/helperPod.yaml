apiVersion: v1
kind: Pod
metadata:
  name: swkoo-quota-helper
  labels:
    app: swkoo-storage-helper
spec:
  automountServiceAccountToken: false
  imagePullSecrets:
    - name: ocir-credentials
  activeDeadlineSeconds: 120
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: helper-pod
      image: nrt.ocir.io/nrznn4yiltsz/swkoo/backend:storage-helper-6839b68be6d6401a65463775d00c6a623b705500
      env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 500m, memory: 128Mi, ephemeral-storage: 64Mi}
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["SYS_ADMIN", "FOWNER", "DAC_OVERRIDE"]
      volumeMounts:
        - name: quota-code
          mountPath: /quota
          readOnly: true
  volumes:
    - name: quota-code
      configMap:
        name: swkoo-user-storage
        items:
          - key: quota.py
            path: quota.py
