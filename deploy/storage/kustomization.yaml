apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: swkoo-storage
resources:
  - resources.yaml
configMapGenerator:
  - name: swkoo-user-storage
    files:
      - config.json
      - helperPod.yaml
      - quota.py
      - setup=setup.sh
      - teardown=teardown.sh
generatorOptions:
  disableNameSuffixHash: true
