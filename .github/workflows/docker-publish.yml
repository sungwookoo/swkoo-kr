name: Build and Push Containers

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/base/**'
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same ref. A
# rapid follow-up push (typo fix, dependent commit) supersedes the
# older run instead of paying runner minutes on a now-stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: ${{ secrets.OCI_REGISTRY_HOST }}
  NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
  BACKEND_REPO: ${{ secrets.OCI_BACKEND_REPO }}
  FRONTEND_REPO: ${{ secrets.OCI_FRONTEND_REPO }}

jobs:
  # D. Path filter: only rebuild the service whose code actually changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/frontend/**'

  backend-test:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci
      - name: Run backend tests
        working-directory: apps/backend
        run: npm test

  frontend-test:
    # Mirrors backend-test. Vitest + jsdom runs in ~3s headless — no
    # browser binary, no Playwright. Runs the production build too so
    # the same job that gates the image push also confirms Next.js can
    # compile the same code.
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/frontend
        run: npm test
      - name: Build frontend (next build)
        working-directory: apps/frontend
        run: npm run build

  backend:
    needs: [changes, backend-test]
    # Run on backend code changes, or whenever the workflow is manually dispatched
    # (paths-filter reports "no changes" on workflow_dispatch, which would otherwise
    # block intentional manual re-runs). Gated on backend-test to prevent
    # publishing an image whose unit tests are red.
    if: |
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch'
    # A. Native ARM runner — no QEMU emulation (cluster target is VM.Standard.A1.Flex, aarch64)
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to OCI registry
        env:
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
        run: |
          if [ -z "$REGISTRY_HOST" ]; then
            echo "REGISTRY_HOST secret is required" >&2
            exit 1
          fi
          echo "$OCI_AUTH_TOKEN" | docker login "${REGISTRY_HOST}" --username "$OCI_USERNAME" --password-stdin

      # B. build-push-action with GHA cache, scope=backend so caches don't evict each other.
      # ignore-error=true keeps transient GHA cache 5xx from killing successful builds.
      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          build-args: BUILD_REVISION=${{ github.sha }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.NAMESPACE }}/${{ env.BACKEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Publish backend latest only from main
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag "${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:latest" "${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:${GITHUB_SHA}"

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          target: storage-helper
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.NAMESPACE }}/${{ env.BACKEND_REPO }}:storage-helper-${{ github.sha }}
          cache-from: type=gha,scope=storage-helper
          cache-to: type=gha,mode=max,scope=storage-helper,ignore-error=true

      - uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          target: storage-provisioner
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.NAMESPACE }}/${{ env.BACKEND_REPO }}:storage-provisioner-${{ github.sha }}
          cache-from: type=gha,scope=storage-provisioner
          cache-to: type=gha,mode=max,scope=storage-provisioner,ignore-error=true

  frontend:
    needs: [changes, frontend-test]
    # Same shape as `backend`: gated on the test job via `needs`. If
    # frontend-test fails or is skipped because it wasn't relevant,
    # this job won't run and no broken image gets pushed.
    if: |
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    # C. Parallel with backend — independent jobs on native ARM runners
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to OCI registry
        env:
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
        run: |
          if [ -z "$REGISTRY_HOST" ]; then
            echo "REGISTRY_HOST secret is required" >&2
            exit 1
          fi
          echo "$OCI_AUTH_TOKEN" | docker login "${REGISTRY_HOST}" --username "$OCI_USERNAME" --password-stdin

      - uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          build-args: BUILD_REVISION=${{ github.sha }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_REPO }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true

      - name: Publish frontend latest only from main
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag "${REGISTRY_HOST}/${NAMESPACE}/${FRONTEND_REPO}:latest" "${REGISTRY_HOST}/${NAMESPACE}/${FRONTEND_REPO}:${GITHUB_SHA}"

  update-manifests:
    needs: [changes, backend, frontend]
    # Run if at least one build succeeded. Skipped/failed builds do not commit a stale tag.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      # If the build job ran and succeeded, always update the tag — regardless of
      # whether the trigger was a path-matching push or a manual workflow_dispatch.
      - name: Update backend image tag
        if: needs.backend.result == 'success'
        run: |
          SHA_TAG="${GITHUB_SHA}"
          sed -i "s|image: ${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:.*|image: ${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:${SHA_TAG}|g" deploy/base/backend/deployment.yaml
          sed -i "s|image: .*|image: ${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:storage-helper-${SHA_TAG}|" deploy/storage/helperPod.yaml
          sed -i "s|image: .*|image: ${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:storage-provisioner-${SHA_TAG}|" deploy/storage/resources.yaml
          sed -i "s|image: .*|image: ${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:storage-helper-${SHA_TAG}|" deploy/local-storage/helperPod.yaml
          sed -i "s|image: .*|image: ${REGISTRY_HOST}/${NAMESPACE}/${BACKEND_REPO}:storage-provisioner-${SHA_TAG}|" deploy/local-storage/deployment.yaml

      - name: Update frontend image tag
        if: needs.frontend.result == 'success'
        run: |
          SHA_TAG="${GITHUB_SHA}"
          sed -i "s|image: ${REGISTRY_HOST}/${NAMESPACE}/${FRONTEND_REPO}:.*|image: ${REGISTRY_HOST}/${NAMESPACE}/${FRONTEND_REPO}:${SHA_TAG}|g" deploy/base/frontend/deployment.yaml

      - name: Validate and merge manifest PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet deploy/base/backend/deployment.yaml deploy/base/frontend/deployment.yaml deploy/storage/helperPod.yaml deploy/storage/resources.yaml deploy/local-storage/helperPod.yaml deploy/local-storage/deployment.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="deploy/images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add deploy/base/backend/deployment.yaml deploy/base/frontend/deployment.yaml deploy/storage/helperPod.yaml deploy/storage/resources.yaml deploy/local-storage/helperPod.yaml deploy/local-storage/deployment.yaml
          git commit -m "chore: update image tags to ${GITHUB_SHA}"
          git fetch origin main
          git rebase origin/main
          git push -u origin "$BRANCH"
          PR=$(gh pr create --base main --head "$BRANCH" --title "Deploy images ${GITHUB_SHA:0:7}" --body "Update only the successfully built image tags. Required tests and builds must pass before deployment.")
          echo "Manifest pull request: $PR" >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
          # Explicit dispatch attaches the same required checks to this commit.
          gh workflow run pr-validation.yml --ref "$BRANCH"
          gh workflow run frontend-smoke.yml --ref "$BRANCH"
          HEAD=$(git rev-parse HEAD)
          for attempt in $(seq 1 90); do
            # Approve only validation runs for this bot-created commit/branch.
            for WORKFLOW in pr-validation.yml frontend-smoke.yml; do
              for RUN in $(gh run list --workflow "$WORKFLOW" --branch "$BRANCH" --event pull_request --json databaseId,headSha,status,conclusion --jq ".[] | select(.headSha == \"$HEAD\" and (.status == \"action_required\" or .conclusion == \"action_required\")) | .databaseId"); do
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/approve"
              done
            done
            if gh pr checks "$PR" --required --json state --jq 'length >= 3 and all(.[]; .state == "SUCCESS")' | grep -qx true; then
              gh pr merge "$PR" --squash --delete-branch
              break
            fi
            if gh pr checks "$PR" --required --json state --jq 'any(.[]; .state == "FAILURE" or .state == "CANCELLED" or .state == "TIMED_OUT")' | grep -qx true; then
              echo "Manifest PR checks failed: $PR" >&2
              exit 1
            fi
            sleep 10
          done
          if [ "$(gh pr view "$PR" --json state --jq .state)" != "MERGED" ]; then
            echo "Manifest PR checks did not finish: $PR" >&2
            exit 1
          fi

      - name: Verify deployed revision, HTTPS and public routes
        timeout-minutes: 17
        env:
          BACKEND_BUILT: ${{ needs.backend.result }}
          FRONTEND_BUILT: ${{ needs.frontend.result }}
        run: |
          ARGS=()
          if [ "$BACKEND_BUILT" = success ]; then ARGS+=(--backend "$GITHUB_SHA"); fi
          if [ "$FRONTEND_BUILT" = success ]; then ARGS+=(--frontend "$GITHUB_SHA"); fi
          python3 scripts/verify-production-release.py "${ARGS[@]}" --wait-seconds 900 --output production-verification.json

      - name: Retain production verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: production-verification.json
          if-no-files-found: ignore
